version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint y @astrojs/check aún no soportan TypeScript 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
